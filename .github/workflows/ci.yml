name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Check installed package resources
        shell: bash
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install \
            --no-deps --force-reinstall dist/musecapsule-*.whl

          cd "$RUNNER_TEMP"

          "$RUNNER_TEMP/wheel-check/bin/python" -I - <<'PY'
          import sys
          from pathlib import Path

          import musecapsule

          package_dir = Path(musecapsule.__file__).resolve().parent

          # Ensure the wheel is imported from the temporary environment.
          assert package_dir.is_relative_to(Path(sys.prefix).resolve()), (
              f"Unexpected package location: {package_dir}"
          )

          required_files = [
              "prompts/metaphor_explorer.md",
              "prompts/hypothesis_proposals.md",
              "prompts/hypothesis_revisions.md",
              "prompts/imagination_guide.md",
              "prompts/idea_evolution.md",
              "prompts/idea_architect.md",
              "bridge/chatgpt.cjs",
          ]

          for relative_path in required_files:
              resource = package_dir / relative_path
              assert resource.is_file(), f"Missing package resource: {relative_path}"
              assert resource.read_text(encoding="utf-8").strip(), (
                  f"Empty package resource: {relative_path}"
              )

          print("Installed wheel contains all required prompts and bridge.")
          PY

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:all

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint
