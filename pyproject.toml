[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "musecapsule"
version = "0.1.0"
description = "Turn imagination into traceable product ideas."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["musecapsule*"]
exclude = ["musecapsule.tests*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["src/musecapsule/tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
